<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>100 часов итальянского B2</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#20252b;background:#f5f6f8}*{box-sizing:border-box}body{margin:0;padding:24px 12px}.app{max-width:440px;margin:auto;background:white;border:1px solid #e5e7eb;border-radius:18px;padding:22px;box-shadow:0 5px 24px #00000009}h1{font-size:20px;margin:0 0 20px}.summary{background:#f5f6f8;border-radius:14px;padding:18px;text-align:center}.muted{color:#707783;font-size:13px}.remaining{font-size:34px;font-weight:750;margin:5px 0 14px;font-variant-numeric:tabular-nums}.stats{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}.track{height:10px;border-radius:10px;background:#dfe3e8;overflow:hidden}.fill{height:100%;width:0;background:#27845c;transition:width .2s}.section{font-weight:650;margin:22px 0 10px;font-size:14px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px}label.small{display:block;color:#707783;font-size:12px;margin-bottom:5px}input[type=number]{width:100%;font:inherit;font-size:18px;padding:12px;border:1px solid #d7dce2;border-radius:10px}input[type=checkbox]{width:17px;height:17px;accent-color:#27845c}.check{display:flex;align-items:center;gap:8px;margin:17px 0;font-size:14px}button{font:inherit;cursor:pointer;border-radius:10px;padding:12px 14px;border:1px solid #d7dce2;background:white}button:disabled{opacity:.4;cursor:not-allowed}.primary{width:100%;background:#20252b;color:white;border-color:#20252b;font-weight:650}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.history{max-height:260px;overflow:auto}.item{padding:12px 0;border-bottom:1px solid #edf0f2;display:flex;justify-content:space-between;gap:8px;font-size:14px}.item small{display:block;color:#737b85;margin-top:4px}.secondary{font-size:13px;padding:9px 11px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.tools button{font-size:12px;padding:8px 10px}.notice{font-size:12px;color:#777;margin-top:15px;line-height:1.5}.complete{color:#27845c;font-weight:700;text-align:center;margin-top:15px}.empty{color:#777;text-align:center;padding:20px 0;font-size:14px}</style></head><body><main class="app"><h1>🇮🇹 100 часов итальянского B2</h1><div class="summary"><div class="muted">Осталось учиться</div><div id="remaining" class="remaining">100 ч 00 мин</div><div class="stats"><span id="done">Пройдено: 0 ч 00 мин</span><strong id="percent">0%</strong></div><div class="track"><div class="fill" id="fill"></div></div></div><div class="section">Добавить время учёбы</div><div class="inputs"><div><label class="small" for="hours">Часы</label><input id="hours" type="number" min="0" step="1" value="0" inputmode="numeric"></div><div><label class="small" for="minutes">Минуты</label><input id="minutes" type="number" min="0" max="59" step="1" placeholder="0" inputmode="numeric"></div></div><label class="check"><input id="course" type="checkbox">Занятия на курсах (учитывать 50%)</label><button class="primary" id="subtract">Вычесть</button><div class="row" style="margin-top:24px"><strong>История записей</strong><span class="muted" id="count">0 записей</span></div><div class="history" id="history"></div><button class="secondary" id="undo" style="width:100%;margin-top:12px">↶ Отменить последнюю запись</button><div class="complete" id="complete" hidden>🏆 100 часов пройдены!</div><div class="tools"><button id="export">↓ Сохранить резервную копию</button><button id="import">↑ Восстановить из файла</button><input type="file" id="file" accept=".json,application/json" hidden></div><div class="notice">Данные автоматически сохраняются в этом браузере. Для защиты от очистки данных периодически сохраняйте резервную копию.</div></main><script>(()=>{'use strict';const KEY='italian-b2-100-hours-v1',MAX=6000;const $=id=>document.getElementById(id);let entries=[];try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(x))entries=x.filter(validEntry)}catch{}function validEntry(e){return e&&Number.isFinite(e.raw)&&e.raw>0&&Number.isFinite(e.counted)&&e.counted>0&&e.counted<=e.raw&&typeof e.course==='boolean'&&typeof e.date==='string'}function fmt(n){const whole=Math.floor(n),seconds=Math.round((n-whole)*60);let mins=whole,sec=seconds;if(sec===60){mins++;sec=0}return `${Math.floor(mins/60)} ч ${String(mins%60).padStart(2,'0')} мин${sec?` ${String(sec).padStart(2,'0')} сек`:''}`}function total(){return entries.reduce((s,e)=>s+e.counted,0)}function save(){try{localStorage.setItem(KEY,JSON.stringify(entries));return true}catch{alert('Не удалось сохранить данные в браузере. Сохраните резервную копию.');return false}}function render(){const t=Math.min(MAX,total()),left=Math.max(0,MAX-t),p=t/MAX*100;$('remaining').textContent=fmt(left);$('done').textContent='Пройдено: '+fmt(t);$('percent').textContent=p.toFixed(1)+'%';$('fill').style.width=p+'%';$('count').textContent=entries.length+' записей';$('undo').disabled=!entries.length;$('complete').hidden=left>0;const h=$('history');h.replaceChildren();if(!entries.length){const e=document.createElement('div');e.className='empty';e.textContent='Пока нет занятий';h.append(e)}else{entries.slice().reverse().forEach(e=>{const div=document.createElement('div');div.className='item';const a=document.createElement('div');a.textContent=e.course?'🎓 Курсы':'📖 Самостоятельно';const small=document.createElement('small');small.textContent=e.date+' · '+fmt(e.raw)+(e.course?' × 50%':'');a.append(small);const b=document.createElement('strong');b.textContent='−'+fmt(e.counted);div.append(a,b);h.append(div)})}check()}function check(){const h=Number($('hours').value||0),m=Number($('minutes').value||0);$('subtract').disabled=!(Number.isInteger(h)&&Number.isInteger(m)&&h>=0&&m>=0&&m<60&&h*60+m>0&&total()<MAX)}$('hours').addEventListener('input',check);$('minutes').addEventListener('input',check);$('subtract').addEventListener('click',()=>{const raw=Number($('hours').value||0)*60+Number($('minutes').value||0);const counted=Math.min(MAX-total(),raw*($('course').checked?.5:1));if(!(counted>0))return;entries.push({raw,counted,course:$('course').checked,date:new Date().toLocaleString('ru-RU')});save();$('hours').value='0';$('minutes').value='';render()});$('undo').addEventListener('click',()=>{if(!entries.length)return;entries.pop();save();render()});$('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({app:'italian-b2-100-hours',version:1,entries},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='italian-b2-100-hours-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});$('import').addEventListener('click',()=>$('file').click());$('file').addEventListener('change',async ev=>{const file=ev.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.app!=='italian-b2-100-hours'||!Array.isArray(data.entries)||!data.entries.every(validEntry)||data.entries.reduce((s,e)=>s+e.counted,0)>MAX)throw Error('Неверный формат');if(confirm('Заменить текущую историю данными из файла?')){entries=data.entries;save();render()}}catch{alert('Не удалось прочитать резервную копию.')}ev.target.value=''});render()})();</script></body></html>
